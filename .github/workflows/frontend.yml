name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check Frontend
        run: |
          if [ -s apps/dashboard/package.json ]; then
            echo "Building frontend dashboard..."
          else
            echo "apps/dashboard/package.json is empty or not yet initialized, skipping."
          fi

