[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowmesh-evaluation"
version = "0.1.0"
description = "Evaluation metrics, benchmarks and reporting for KnowMesh"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["evaluation"]

[tool.setuptools.package-dir]
evaluation = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
