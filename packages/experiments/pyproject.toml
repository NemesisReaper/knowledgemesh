[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowmesh-experiments"
version = "0.1.0"
description = "Hypotheses, protocols, execution tracking, outcomes, and reproducibility for KnowMesh"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["experiments"]

[tool.setuptools.package-dir]
experiments = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

