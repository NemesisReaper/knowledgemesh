[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowmesh-knowledge"
version = "0.1.0"
description = "KnowMesh SQLAlchemy persistence models"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]
