[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowmesh-knowledge"
version = "0.1.0"
description = "KnowMesh SQLAlchemy persistence models"
requires-python = ">=3.10"
dependencies = ["SQLAlchemy>=2.0,<3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
