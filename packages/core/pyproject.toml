[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowmesh-core"
version = "0.1.0"
description = "Shared foundational primitives for KnowMesh"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["core"]

[tool.setuptools.package-dir]
core = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
