[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowmesh-trust"
version = "0.1.0"
description = "Identity, signature, provenance and trust policy primitives for KnowMesh"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[tool.setuptools]
packages = ["trust"]

[tool.setuptools.package-dir]
trust = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
